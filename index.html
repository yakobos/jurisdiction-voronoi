<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parish Voronoi — 500 mi around Burns, OR</title>
<style>
:root{--bg:#070a0f;--panel:#0f1520;--panel2:#151d2b;--line:#212c3c;--text:#e8eef7;--muted:#8b9cb3;--accent:#4dabf7}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;height:100dvh}
#sidebar{width:334px;flex:0 0 334px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sbHead{padding:15px 16px 12px;border-bottom:1px solid var(--line)}
#sbHead h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em}
#sbHead p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
#sbBody{flex:1;overflow-y:auto;padding:12px 10px 14px;min-height:0}
#sbFoot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.55}
#sbBody::-webkit-scrollbar{width:9px}
#sbBody::-webkit-scrollbar-thumb{background:#243044;border-radius:9px}
.stats{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--muted);margin:2px 2px 6px}
.stats b{color:var(--text)}
h2.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:16px 8px 7px;font-weight:700}
.hintInline{text-transform:none;letter-spacing:0;font-weight:500;font-size:10px;opacity:.75}
.leg{display:grid;grid-template-columns:11px 1fr 30px 44px;align-items:center;gap:8px;width:100%;padding:6px 8px;background:transparent;border:0;border-radius:7px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.leg:hover{background:var(--panel2)}
.leg.off{opacity:.38}
.leg .dot{width:11px;height:11px;border-radius:3px}
.leg .jn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .cnt,.leg .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.hrow{display:grid;grid-template-columns:11px 1fr auto auto;align-items:center;gap:7px;padding:5px 8px;font-size:12px;border-radius:7px}
.hrow:hover{background:var(--panel2)}
.hrow .dot{width:11px;height:11px;border-radius:3px}
.hrow .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9d6e6}
.mini{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;padding:2px 7px;border-radius:6px;cursor:pointer;text-transform:none;letter-spacing:0}
.mini:hover{color:var(--text);border-color:#3a4a63}
.mini.danger:hover{color:#ff8787;border-color:#5a2b2b}
.empty{margin:4px 8px;font-size:11.5px;color:var(--muted)}
#mapWrap{position:relative;flex:1;min-width:0;background:radial-gradient(120% 100% at 50% 0%,#0d1522 0%,#070a0f 70%)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.cell{fill-opacity:.46;stroke:#04070c;stroke-width:1.1;vector-effect:non-scaling-stroke;cursor:crosshair}
.cell:hover{fill-opacity:.78}
.pin{stroke:#04070c;stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer}
.pin:hover{stroke:#fff}
.pin.custom{stroke:#fff;stroke-dasharray:2 2}
.ring{fill:none;stroke:#9fd4ff;stroke-width:1.5;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;opacity:.8;pointer-events:none}
.centerMark{fill:none;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.95;pointer-events:none}
.labels{fill:#fff;text-anchor:middle;dominant-baseline:middle;font-weight:650;letter-spacing:.01em;paint-order:stroke;stroke:#04070c;stroke-linejoin:round;pointer-events:none}
.attrib{position:absolute;left:12px;bottom:10px;font-size:9.5px;color:#a8b8cc;opacity:.8;pointer-events:none;text-shadow:0 1px 2px #000;letter-spacing:.02em}
#tip{position:fixed;z-index:20;max-width:280px;background:#0d1420;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;pointer-events:none}
#tip.on{opacity:1;transform:none}
#tip .tj{color:var(--muted);font-size:11px;margin-top:2px}
#tip .tm{color:#9fb2c9;font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
#ctrls{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
#ctrls button{width:34px;height:34px;border-radius:9px;background:#101827cc;border:1px solid var(--line);color:var(--text);font-size:16px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
#ctrls button:hover{background:#182233}
#ctrls button.wide{font-size:9.5px;font-weight:800;letter-spacing:.03em}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#04070bd9;backdrop-filter:blur(3px);z-index:40}
.modal.open{display:flex}
.card{width:344px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.card h3{margin:0 0 2px;font-size:14px}
.coords{margin:0 0 14px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px;font-weight:700}
.fld input,.fld select{display:block;width:100%;margin-top:5px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400}
.fld input:focus,.fld select:focus{outline:2px solid #2b6cb0;outline-offset:1px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{background:var(--accent);color:#04121f;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:650;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text)}
@media (max-width:820px){#sidebar{width:280px;flex-basis:280px}}
</style>
</head>

    <div id="sbFoot">Click a dot to hide it &middot; click the map to add a parish<br>Drag to pan &middot; scroll to zoom &middot; SAT cycles imagery</div>
  </aside>
  <main id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="tileLayer"></g>

      <g id="overlay"></g>
    </svg>
    <div id="attrib" class="attrib"></div>
    <div id="tip"></div>
    <div id="ctrls">
      <button id="prov" class="wide" title="Cycle basemap">SAT</button>
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit to all">⤢</button>
    </div>
  </main>
</div>
<div id="modal" class="modal">

    <div class="row">

  </div>
</div>

/* ---------------------------- GEOMETRY ---------------------------- */
const D2R = Math.PI / 180, R2D = 180 / Math.PI, EARTH_MI = 3958.7613;

/* Web Mercator, screen-oriented: x = lon, y = -ln(tan(pi/4 + lat/2)).
   The minus sign is what makes north point UP, since SVG y grows downward.
   Conformal, so Voronoi cells keep locally correct shape, and the tile
   grid is a uniform square lattice in this space (one tile = 360/2^z units). */
function proj(lat, lng){
  return { x: lng, y: -Math.log(Math.tan(Math.PI / 4 + (lat * D2R) / 2)) * R2D };
}
function unproj(x, y){
  return { lat: (2 * Math.atan(Math.exp(-y * D2R)) - Math.PI / 2) * R2D, lng: x };
}
function haversine(a, b){
  const dLat = (b.lat - a.lat) * D2R, dLng = (b.lng - a.lng) * D2R;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * D2R) * Math.cos(b.lat * D2R) * Math.sin(dLng / 2) ** 2;
  return 2 * EARTH_MI * Math.asin(Math.min(1, Math.sqrt(s)));
}
function destination(from, angDist, bearing){
  const p1 = from.lat * D2R, l1 = from.lng * D2R;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(angDist) +
                       Math.cos(p1) * Math.sin(angDist) * Math.cos(bearing));
  const l2 = l1 + Math.atan2(Math.sin(bearing) * Math.sin(angDist) * Math.cos(p1),
                             Math.cos(angDist) - Math.sin(p1) * Math.sin(p2));
  return { lat: p2 * R2D, lng: l2 * R2D };
}

/* Keep the part of `poly` at least as close to A as to B:
   clip against the perpendicular bisector of A-B. */
function clipHalfPlane(poly, ax, ay, bx, by){
  const nx = bx - ax, ny = by - ay;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++){
    const P = poly[i], Q = poly[(i + 1) % n];
    const sp = (P[0] - mx) * nx + (P[1] - my) * ny;
    const sq = (Q[0] - mx) * nx + (Q[1] - my) * ny;
    if (sp <= 0) out.push(P);
    if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)){
      const t = sp / (sp - sq);
      out.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]);
    }
  }
  return out;
}
function polyArea(poly){
  let a = 0, n = poly.length;
  for (let i = 0; i < n; i++){
    const p = poly[i], q = poly[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}
function polyCentroid(poly){
  let a = 0, cx = 0, cy = 0, n = poly.length;
  for (let i = 0; i < n; i++){
    const p = poly[i], q = poly[(i + 1) % n];
    const f = p[0] * q[1] - q[0] * p[1];
    a += f; cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f;
  }
  a /= 2;
  if (Math.abs(a) < 1e-12){
    let sx = 0, sy = 0;
    for (const p of poly){ sx += p[0]; sy += p[1]; }
    return [sx / n, sy / n];
  }
  return [cx / (6 * a), cy / (6 * a)];
}
function polyBBox(poly){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of poly){
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return { x0, x1, y0, y1 };
}
function maxRadius(poly, x, y){
  let m = 0;
  for (const p of poly){
    const d = (p[0] - x) ** 2 + (p[1] - y) ** 2;
    if (d > m) m = d;
  }
  return Math.sqrt(m);
}
function polyPath(poly){
  let d = 'M';
  for (let i = 0; i < poly.length; i++){
    d += (i ? 'L' : '') + poly[i][0].toFixed(3) + ' ' + poly[i][1].toFixed(3);
  }
  return d + 'Z';
}

/* Voronoi by half-plane clipping against a bounding rectangle.
   Sorted-neighbour early exit keeps it near O(n * neighbours). */
function computeCells(list, b){
  const pts = list.map(p => {
    const q = proj(p.lat, p.lng);
    return { p, x: q.x, y: q.y };
  });
  const n = pts.length;
  const rect = [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]];
  const cells = [];

  for (let i = 0; i < n; i++){
    const a = pts[i];
    const order = [];
    for (let j = 0; j < n; j++){
      if (j === i) continue;
      const q = pts[j];
      const dx = a.x - q.x, dy = a.y - q.y;
      order.push([dx * dx + dy * dy, q]);
    }
    order.sort((u, v) => u[0] - v[0]);

    let poly = rect;
    let maxR = maxRadius(poly, a.x, a.y);
    for (let k = 0; k < order.length; k++){
      const d = Math.sqrt(order[k][0]);
      if (d > 2 * maxR) break;          /* no further site can clip us */
      const q = order[k][1];
      poly = clipHalfPlane(poly, a.x, a.y, q.x, q.y);
      if (poly.length < 3){ poly = []; break; }
      maxR = maxRadius(poly, a.x, a.y);
    }
    if (poly.length < 3) continue;      /* coincident sites share no area */

    cells.push({
      site: a, poly,
      area: polyArea(poly),
      bbox: polyBBox(poly),
      centroid: polyCentroid(poly)
    });
  }
  return cells;
}

const parishes = RAW.map(r => ({
  id: r[0], name: r[1], jurisdiction: r[2], city: r[3], state: r[4],
  lat: r[5], lng: r[6], miles: r[7], hidden: false, custom: false
}));
const byId = new Map(parishes.map(p => [p.id, p]));
let nextId = parishes.reduce((m, p) => Math.max(m, p.id), 0) + 1;

const offJuris = new Set();   /* jurisdictions toggled off in the legend */
let bounds = null;            /* {x0,x1,y0,y1} in projected units    */
let vb = null;                /* current viewBox                     */
let cellCache = null;         /* cached Voronoi cells                */
let cellSig = '';             /* signature of the visible set        */
let jurAreaCache = { total: 0, byJur: {} };

function visible(){
  return parishes.filter(p => !p.hidden && !offJuris.has(p.jurisdiction));
}
function computeBounds(){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of parishes){
    const q = proj(p.lat, p.lng);
    if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x;
    if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y;
  }
  if (!isFinite(x0)) return { x0: -1, x1: 1, y0: -1, y1: 1 };
  const pad = Math.max(x1 - x0, y1 - y0) * 0.05 + 0.25;
  return { x0: x0 - pad, x1: x1 + pad, y0: y0 - pad, y1: y1 + pad };
}

/* Fit the data box into the viewport, expanding it to the viewport's
   aspect ratio so nothing is letterboxed and no tiles are wasted. */
function fitView(){
  const W = Math.max(1, svg.clientWidth || 900);
  const H = Math.max(1, svg.clientHeight || 650);
  let w = bounds.x1 - bounds.x0, h = bounds.y1 - bounds.y0;
  const target = W / H;
  if (w / h < target) w = h * target; else h = w / target;
  const cx = (bounds.x0 + bounds.x1) / 2, cy = (bounds.y0 + bounds.y1) / 2;
  vb = { x: cx - w / 2, y: cy - h / 2, w, h };
}

/* 500-mile reference ring: true geodesic circle, projected */
const RING = (function(){
  const d = 500 / EARTH_MI, N = 240, pts = [];
  for (let i = 0; i < N; i++){
    const t = destination(CENTER, d, i * 2 * Math.PI / N);
    const q = proj(t.lat, t.lng);
    pts.push(q.x.toFixed(3) + ' ' + q.y.toFixed(3));
  }
  return 'M' + pts.join('L') + 'Z';
})();

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

/* ---------------------------- BASEMAP ---------------------------- */
/* Both endpoints are keyless. USGS The National Map is public domain and
   covers the whole extent here; Esri is the fallback if USGS is blocked. */
const PROVIDERS = {
  usgs: {
    label: 'SAT', max: 16, attrib: 'Imagery: USGS The National Map',
    url: (z, x, y) => 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/' + z + '/' + y + '/' + x
  },
  esri: {
    label: 'ESRI', max: 19, attrib: 'Imagery: Esri, Maxar, Earthstar Geographics',
    url: (z, x, y) => 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x
  },
  none: { label: 'OFF', max: 0, attrib: '', url: null }
};
const PROVIDER_ORDER = ['usgs', 'esri', 'none'];
let provider = 'usgs';
let tileFailed = false;
const tileEls = new Map();
const SVGNS = 'http://www.w3.org/2000/svg';

function updateAttrib(){
  const p = PROVIDERS[provider];
  attribEl.textContent = p.url ? (p.attrib + (tileFailed ? ' — tiles blocked / offline' : '')) : '';
}
function clearTiles(){
  tileEls.forEach(el => el.remove());
  tileEls.clear();
}

/* Tiles live in the same user space as the polygons, so panning only needs
   a viewBox change — the images stay put and are not re-fetched. */
function renderTiles(W){
  const prov = PROVIDERS[provider];
  if (!prov || !prov.url){ clearTiles(); updateAttrib(); return; }

  let z = Math.round(Math.log2((360 * W) / (256 * vb.w)));
  z = Math.max(2, Math.min(prov.max, z));
  let S = 360 / Math.pow(2, z);
  let tx0, tx1, ty0, ty1;
  const span = () => {
    tx0 = Math.floor((vb.x + 180) / S);
    tx1 = Math.floor((vb.x + vb.w + 180) / S);
    ty0 = Math.floor((vb.y + 180) / S);
    ty1 = Math.floor((vb.y + vb.h + 180) / S);
  };
  span();
  while ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) > 260 && z > 2){ z--; S = 360 / Math.pow(2, z); span(); }

  for (let ty = ty0; ty <= ty1; ty++){
    for (let tx = tx0; tx <= tx1; tx++){
      const key = provider + '/' + z + '/' + tx + '/' + ty;
      if (tileEls.has(key)) continue;
      const img = document.createElementNS(SVGNS, 'image');
      img.setAttribute('x', (tx * S - 180).toFixed(4));
      img.setAttribute('y', (ty * S - 180).toFixed(4));
      img.setAttribute('width', S.toFixed(4));
      img.setAttribute('height', S.toFixed(4));
      img.setAttribute('preserveAspectRatio', 'none');
      img.setAttribute('pointer-events', 'none');
      const src = prov.url(z, tx, ty);
      img.setAttribute('href', src);
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', src);
      img.addEventListener('error', () => { if (!tileFailed){ tileFailed = true; updateAttrib(); } });
      tileLayer.appendChild(img);
      tileEls.set(key, img);
    }
  }
  /* drop tiles well outside the view (one-tile buffer avoids thrashing) */
  tileEls.forEach((el, key) => {
    const parts = key.split('/');
    const zz = +parts[1], tx = +parts[2], ty = +parts[3];
    if (zz !== z || tx < tx0 - 1 || tx > tx1 + 1 || ty < ty0 - 1 || ty > ty1 + 1){
      el.remove(); tileEls.delete(key);
    }
  });
  updateAttrib();
}

let rafId = null, pendingRender = false;
function schedule(){
  if (pendingRender) return;
  pendingRender = true;
  rafId = requestAnimationFrame(() => { pendingRender = false; rafId = null; render(); });
}

function render(){
  const W = Math.max(1, svg.clientWidth || 900);
  const H = Math.max(1, svg.clientHeight || 650);
  const upp = Math.max(vb.w / W, vb.h / H);   /* user units per screen px */
  svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);

  renderTiles(W);
  scrim.setAttribute('x', vb.x); scrim.setAttribute('y', vb.y);
  scrim.setAttribute('width', vb.w); scrim.setAttribute('height', vb.h);
  scrim.setAttribute('opacity', PROVIDERS[provider].url ? '0.28' : '0');

  const vis = visible();
  const sig = vis.length + '|' + vis.map(p => p.id).join(',');
  if (!cellCache || cellSig !== sig){
    cellCache = computeCells(vis, bounds);
    cellSig = sig;
  }
  const cells = cellCache;

  let total = 0; const byJur = {};
  for (const c of cells){
    total += c.area;
    const j = c.site.p.jurisdiction;
    byJur[j] = (byJur[j] || 0) + c.area;
  }
  jurAreaCache = { total, byJur };

  tip.classList.remove('on');
  const fs = 11 * upp, pr = 5.5 * upp;
  const out = [];

  /* polygons */
  out.push('<g>');
  for (const c of cells){
    out.push('<path class="cell" data-id="' + c.site.p.id + '" d="' +
             polyPath(c.poly) + '" fill="' + colorOf(c.site.p.jurisdiction) + '"/>');
  }
  out.push('</g>');

  /* 500 mi ring + Burns crosshair */
  out.push('<path class="ring" d="' + RING + '"/>');
  const cp = proj(CENTER.lat, CENTER.lng);
  out.push('<g class="centerMark"><circle cx="' + cp.x + '" cy="' + cp.y + '" r="' +
           (7 * upp) + '"/><path d="M' + (cp.x - 15 * upp) + ' ' + cp.y +
           'H' + (cp.x + 15 * upp) + 'M' + cp.x + ' ' + (cp.y - 15 * upp) +
           'V' + (cp.y + 15 * upp) + '"/></g>');

  /* labels, only where the cell is large enough on screen */
  out.push('<g class="labels" style="font-size:' + fs.toFixed(2) +
           'px;stroke-width:' + (3 * upp).toFixed(3) + '">');
  for (const c of cells){
    const bb = c.bbox;
    const wpx = (bb.x1 - bb.x0) / upp, hpx = (bb.y1 - bb.y0) / upp;
    if (wpx < 96 || hpx < 26) continue;
    if (c.area / (upp * upp) < 2600) continue;
    let nm = c.site.p.name;
    if (nm.length > 36) nm = nm.slice(0, 35).trim() + '\u2026';
    out.push('<text x="' + c.centroid[0].toFixed(2) + '" y="' +
             c.centroid[1].toFixed(2) + '">' + esc(nm) + '</text>');
  }
  out.push('</g>');

  /* pins */
  out.push('<g>');
  for (const p of vis){
    const q = proj(p.lat, p.lng);
    out.push('<circle class="pin' + (p.custom ? ' custom' : '') + '" data-id="' + p.id +
             '" cx="' + q.x + '" cy="' + q.y + '" r="' + pr.toFixed(3) +
             '" fill="' + colorOf(p.jurisdiction) + '"/>');
  }
  out.push('</g>');

  overlay.innerHTML = out.join('');
  renderSidebar();
}

function renderSidebar(){
  const vis = visible();
  const counts = {};
  for (const p of parishes) counts[p.jurisdiction] = (counts[p.jurisdiction] || 0) + 1;
  const shown = new Set(vis.map(p => p.jurisdiction));

  statsEl.innerHTML = '<b>' + vis.length + '</b> of <b>' + parishes.length +
    '</b> parishes &middot; <b>' + shown.size + '</b> of ' + Object.keys(counts).length +
    ' jurisdictions';

  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  let h = '';
  for (const j of keys){
    const off = offJuris.has(j);
    const area = jurAreaCache.byJur[j] || 0;
    const pct = jurAreaCache.total ? (area / jurAreaCache.total) * 100 : 0;
    h += '<button class="leg' + (off ? ' off' : '') + '" data-jur="' + esc(j) +
         '" title="' + esc(fullName(j)) + ' — click to ' + (off ? 'show' : 'hide') + '">' +
         '<span class="dot" style="background:' + colorOf(j) + '"></span>' +
         '<span class="jn">' + esc(j) + '</span>' +
         '<span class="cnt">' + counts[j] + '</span>' +
         '<span class="pct">' + (off ? '—' : pct.toFixed(1) + '%') + '</span></button>';
  }
  legendEl.innerHTML = h;

  const hid = parishes.filter(p => p.hidden);
  if (!hid.length){
    hiddenEl.innerHTML = '<p class="empty">Nothing hidden. Click any dot on the map to hide that parish.</p>';
  } else {
    hiddenEl.innerHTML = hid.map(p =>
      '<div class="hrow"><span class="dot" style="background:' + colorOf(p.jurisdiction) + '"></span>' +
      '<span class="hn" title="' + esc(p.name) + '">' + esc(p.name) + '</span>' +
      '<button class="mini" data-restore="' + p.id + '">restore</button>' +
      (p.custom ? '<button class="mini danger" data-del="' + p.id + '">del</button>' : '') +
      '</div>').join('');
  }
}

/* ------------------------- coordinate helpers ------------------------- */
function toUser(clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  const q = pt.matrixTransform(m.inverse());
  return { x: q.x, y: q.y };
}
function clampW(w){
  const base = bounds.x1 - bounds.x0;
  return Math.min(base * 2, Math.max(base / 80, w));
}
function zoomAt(q, f){
  const nw = clampW(vb.w * f), k = nw / vb.w;
  vb.x = q.x - (q.x - vb.x) * k;
  vb.y = q.y - (q.y - vb.y) * k;
  vb.w = nw; vb.h *= k;
  schedule();
}

/* ------------------------------ events ------------------------------ */
let drag = null, suppress = false;

svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  suppress = false;
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});

svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
  if (drag.moved){
    const a = toUser(drag.x, drag.y), b = toUser(e.clientX, e.clientY);
    vb.x -= (b.x - a.x);
    vb.y -= (b.y - a.y);
    schedule();
  }
  drag.x = e.clientX; drag.y = e.clientY;
});

svg.addEventListener('pointerup', () => {
  if (drag && drag.moved) suppress = true;
  drag = null;
});
svg.addEventListener('pointercancel', () => { drag = null; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(toUser(e.clientX, e.clientY), Math.exp(e.deltaY * 0.0015));
}, { passive: false });

svg.addEventListener('click', e => {
  if (suppress){ suppress = false; return; }
  const pin = e.target.closest ? e.target.closest('.pin') : null;
  if (pin){
    const p = byId.get(+pin.dataset.id);
    if (p){ p.hidden = true; cellCache = null; render(); }
    return;
  }
  openCreate(toUser(e.clientX, e.clientY));
});

svg.addEventListener('mousemove', e => {
  const pin = e.target.closest ? e.target.closest('.pin') : null;
  if (!pin){ tip.classList.remove('on'); return; }
  const p = byId.get(+pin.dataset.id);
  if (!p) return;
  tip.innerHTML = '<b>' + esc(p.name) + '</b>' +
    '<div class="tj">' + esc(fullName(p.jurisdiction)) + '</div>' +
    '<div class="tm">' + esc(p.city) + (p.state ? ', ' + esc(p.state) : '') +
    ' &middot; ' + p.miles + ' mi from Burns</div>';
  tip.classList.add('on');
  const w = tip.offsetWidth || 230, hgt = tip.offsetHeight || 64;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y + hgt > innerHeight - 8) y = e.clientY - hgt - 16;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
});
svg.addEventListener('mouseleave', () => tip.classList.remove('on'));

/* legend: toggle a whole jurisdiction in/out of the diagram */
legendEl.addEventListener('click', e => {
  const b = e.target.closest('.leg');
  if (!b) return;
  const j = b.dataset.jur;
  if (offJuris.has(j)) offJuris.delete(j); else offJuris.add(j);
  cellCache = null;
  render();
});

/* hidden list: restore / delete */
hiddenEl.addEventListener('click', e => {
  const r = e.target.closest('[data-restore]');
  if (r){
    const p = byId.get(+r.dataset.restore);
    if (p){ p.hidden = false; cellCache = null; render(); }
    return;
  }
  const d = e.target.closest('[data-del]');
  if (d){
    const id = +d.dataset.del;
    const i = parishes.findIndex(p => p.id === id);
    if (i >= 0){ parishes.splice(i, 1); byId.delete(id); }
    bounds = computeBounds();
    cellCache = null;
    render();
  }
});

document.getElementById('restoreAll').addEventListener('click', () => {
  for (const p of parishes) p.hidden = false;
  offJuris.clear();
  cellCache = null;
  render();
});

/* basemap cycle: USGS -> Esri -> off -> USGS */
document.getElementById('prov').addEventListener('click', () => {
  const i = PROVIDER_ORDER.indexOf(provider);
  provider = PROVIDER_ORDER[(i + 1) % PROVIDER_ORDER.length];
  document.getElementById('prov').textContent = PROVIDERS[provider].label;
  tileFailed = false;
  clearTiles();
  render();
});

document.getElementById('zin').addEventListener('click', () => {
  zoomAt({ x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 }, 0.72);
});
document.getElementById('zout').addEventListener('click', () => {
  zoomAt({ x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 }, 1 / 0.72);
});
document.getElementById('zfit').addEventListener('click', () => { fitView(); schedule(); });

/* --------------------------- create flow --------------------------- */
let pending = null;
const mName = document.getElementById('mName');
const mJur = document.getElementById('mJur');
const mCoords = document.getElementById('mCoords');

mJur.innerHTML = Object.keys(JUR).map(j =>
  '<option value="' + esc(j) + '">' + esc(j) + ' — ' + esc(JUR[j].full) + '</option>').join('');

function openCreate(q){
  pending = q;
  const ll = unproj(q.x, q.y);
  mCoords.textContent = ll.lat.toFixed(4) + '°, ' + ll.lng.toFixed(4) + '°  ·  ' +
                        haversine(CENTER, ll).toFixed(1) + ' mi from Burns';
  mName.value = '';
  mJur.value = 'GOA';
  modal.classList.add('open');
  setTimeout(() => mName.focus(), 30);
}
function closeCreate(){ modal.classList.remove('open'); pending = null; }

function addParish(){
  if (!pending) return;
  const ll = unproj(pending.x, pending.y);
  const name = (mName.value || '').trim() || 'Untitled parish';
  const p = {
    id: nextId++, name,
    jurisdiction: mJur.value,
    city: '—', state: '',
    lat: ll.lat, lng: ll.lng,
    miles: Math.round(haversine(CENTER, ll) * 10) / 10,
    hidden: false, custom: true
  };
  parishes.push(p); byId.set(p.id, p);

  const b = computeBounds();
  const grew = b.x0 < bounds.x0 || b.x1 > bounds.x1 || b.y0 < bounds.y0 || b.y1 > bounds.y1;
  bounds = b;
  if (grew) fitView();

  cellCache = null;
  closeCreate();
  render();
}

document.getElementById('mAdd').addEventListener('click', addParish);
document.getElementById('mCancel').addEventListener('click', closeCreate);
modal.addEventListener('click', e => { if (e.target === modal) closeCreate(); });
mName.addEventListener('keydown', e => { if (e.key === 'Enter') addParish(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCreate(); });

/* ------------------------------ boot ------------------------------ */
bounds = computeBounds();
fitView();
render();

let rsz = null;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => {
    /* keep the centre and the vertical extent, just re-match the aspect */
    const W = Math.max(1, svg.clientWidth || 900), H = Math.max(1, svg.clientHeight || 650);
    const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
    let h = vb.h, w = h * (W / H);
    vb = { x: cx - w / 2, y: cy - h / 2, w, h };
    render();
  }, 120);
});
</script>
</body>
</html>
