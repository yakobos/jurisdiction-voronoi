<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive-time basins + population — 500 mi around Burns, OR</title>
<style>
:root{--bg:#070a0f;--panel:#0f1520;--panel2:#151d2b;--line:#212c3c;--text:#e8eef7;--muted:#8b9cb3;--accent:#4dabf7}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;height:100dvh}
#sidebar{width:352px;flex:0 0 352px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sbHead{padding:15px 16px 12px;border-bottom:1px solid var(--line)}
#sbHead h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em}
#sbHead p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
#sbBody{flex:1;overflow-y:auto;padding:12px 10px 14px;min-height:0}
#sbFoot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.55}
#sbBody::-webkit-scrollbar{width:9px}
#sbBody::-webkit-scrollbar-thumb{background:#243044;border-radius:9px}
.stats{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--muted);margin:2px 2px 6px;line-height:1.7}
.stats b{color:var(--text)}
.stats .big{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stats .sub{font-size:10.5px;color:#6b7c92;margin-top:2px}
h2.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:16px 8px 7px;font-weight:700}
.hintInline{text-transform:none;letter-spacing:0;font-weight:500;font-size:10px;opacity:.75}
.legHead{display:grid;grid-template-columns:11px 1fr 26px 40px 46px;gap:6px;padding:0 8px 4px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5f7085}
.legHead span:nth-child(n+3){text-align:right}
.leg{display:grid;grid-template-columns:11px 1fr 26px 40px 46px;align-items:center;gap:6px;width:100%;padding:6px 8px;background:transparent;border:0;border-radius:7px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.leg:hover{background:var(--panel2)}
.leg.off{opacity:.38}
.leg .dot{width:11px;height:11px;border-radius:3px}
.leg .jn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .cnt,.leg .pct,.leg .pop{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.leg .pop{color:#b9c9dc}
.hrow{display:grid;grid-template-columns:11px 1fr auto auto;align-items:center;gap:7px;padding:5px 8px;font-size:12px;border-radius:7px}
.hrow:hover{background:var(--panel2)}
.hrow .dot{width:11px;height:11px;border-radius:3px}
.hrow .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9d6e6}
.mini{background:transparent;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;padding:2px 7px;border-radius:6px;cursor:pointer;text-transform:none;letter-spacing:0}
.mini:hover{color:var(--text);border-color:#3a4a63}
.mini.danger:hover{color:#ff8787;border-color:#5a2b2b}
.empty{margin:4px 8px;font-size:11.5px;color:var(--muted)}
.sliderBox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin:2px 2px 4px}
.sliderBox .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}
.sliderBox .lab b{color:var(--text);font-variant-numeric:tabular-nums}
.sliderBox input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:16px}
.sliderBox .ends{display:flex;justify-content:space-between;font-size:9.5px;color:#6b7c92;margin-top:5px;letter-spacing:.02em}
#mapWrap{position:relative;flex:1;min-width:0;background:radial-gradient(120% 100% at 50% 0%,#0d1522 0%,#070a0f 70%)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.crowCell{fill-opacity:.5;stroke:#04070c;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.pin{stroke:#04070c;stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer}
.pin:hover{stroke:#fff}
.pin.custom{stroke:#fff;stroke-dasharray:2 2}
.ring{fill:none;stroke:#9fd4ff;stroke-width:1.5;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;opacity:.8;pointer-events:none}
.centerMark{fill:none;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.95;pointer-events:none}
.labels{fill:#fff;text-anchor:middle;dominant-baseline:middle;font-weight:650;letter-spacing:.01em;paint-order:stroke;stroke:#04070c;stroke-linejoin:round;pointer-events:none}
.labels .lp{font-weight:500;fill:#dbe7f5}
.attrib{position:absolute;left:12px;bottom:10px;font-size:9.5px;color:#a8b8cc;opacity:.8;pointer-events:none;text-shadow:0 1px 2px #000;letter-spacing:.02em}
#tip{position:fixed;z-index:20;max-width:320px;background:#0d1420;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;pointer-events:none}
#tip.on{opacity:1;transform:none}
#tip .tj{color:var(--muted);font-size:11px;margin-top:2px}
#tip .tm{color:#9fb2c9;font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
#tip .tp{color:#cfe1f5;font-size:12px;margin-top:5px;font-variant-numeric:tabular-nums;border-top:1px solid #1d2839;padding-top:5px}
#tip .tp b{color:#fff}
#ctrls{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
#ctrls button{width:38px;height:34px;border-radius:9px;background:#101827cc;border:1px solid var(--line);color:var(--text);font-size:16px;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
#ctrls button:hover{background:#182233}
#ctrls button.wide{font-size:9px;font-weight:800;letter-spacing:.04em}
#ctrls button.act{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#04070bd9;backdrop-filter:blur(3px);z-index:40}
.modal.open{display:flex}
.card{width:344px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.card h3{margin:0 0 2px;font-size:14px}
.coords{margin:0 0 14px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px;font-weight:700}
.fld input,.fld select{display:block;width:100%;margin-top:5px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400}
.fld input:focus,.fld select:focus{outline:2px solid #2b6cb0;outline-offset:1px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{background:var(--accent);color:#04121f;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:650;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text)}
@media (max-width:820px){#sidebar{width:300px;flex-basis:300px}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sbHead"><h1>Drive-time basins</h1><p>500 mi radius &middot; Burns, OR &middot; population</p></div>
    <div id="sbBody">
      <div id="stats" class="stats"></div>
      <div class="sliderBox">
        <div class="lab"><span>Off-road speed</span><b id="offVal">14 mph</b></div>
        <input id="offRoad" type="range" min="4" max="40" step="1" value="14">
        <div class="ends"><span>strong corridors</span><span>near crow-flies</span></div>
      </div>
      <h2 class="sec">Jurisdictions <span class="hintInline">click to toggle</span></h2>
      <div class="legHead"><span></span><span>jurisdiction</span><span>#</span><span>area</span><span>people</span></div>
      <div id="legend"></div>
      <h2 class="sec">Hidden <button id="restoreAll" class="mini">restore all</button></h2>
      <div id="hiddenList"></div>
    </div>
    <div id="sbFoot">Click a dot to hide it &middot; click the map to add a parish<br>Drag to pan &middot; scroll to zoom</div>
  </aside>
  <main id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="ringClip"><path id="ringClipPath" d=""/></clipPath></defs>
      <g id="tileLayer"></g>
      <rect id="scrim" x="0" y="0" width="1" height="1" fill="#04070c" opacity="0" pointer-events="none"/>
      <image id="basinImg" clip-path="url(#ringClip)" preserveAspectRatio="none" opacity="0.6" pointer-events="none" style="image-rendering:auto"></image>
      <g id="crowLayer" clip-path="url(#ringClip)"></g>
      <g id="overlay"></g>
    </svg>
    <div id="attrib" class="attrib"></div>
    <div id="tip"></div>
    <div id="ctrls">
      <button id="mode" class="wide act" title="Toggle drive-time / crow-flies">DRIVE</button>
      <button id="prov" class="wide" title="Cycle basemap">SAT</button>
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
      <button id="zfit" title="Fit to all">&#10530;</button>
    </div>
  </main>
</div>
<div id="modal" class="modal">
  <div class="card">
    <h3>New parish</h3>
    <p id="mCoords" class="coords"></p>
    <label class="fld">Name<input id="mName" type="text" maxlength="80" placeholder="St. Tikhon of Zadonsk Mission"></label>
    <label class="fld">Jurisdiction<select id="mJur"></select></label>
    <div class="row">
      <button id="mCancel" class="btn ghost">Cancel</button>
      <button id="mAdd" class="btn">Add parish</button>
    </div>
  </div>
</div>

/* ================= GEOMETRY ================= */
const D2R=Math.PI/180, R2D=180/Math.PI, EARTH_MI=3958.7613;
/* Screen-oriented Web Mercator: y grows downward, so NEGATE ln(tan(...)).
   Conformal -> projected squares are ground squares, and the tile lattice
   is a uniform square grid of 360/2^z projected degrees. */
function proj(lat,lng){ return {x:lng, y:-Math.log(Math.tan(Math.PI/4+(lat*D2R)/2))*R2D}; }
function unproj(x,y){ return {lat:(2*Math.atan(Math.exp(-y*D2R))-Math.PI/2)*R2D, lng:x}; }
function haversine(a,b){
  const dLat=(b.lat-a.lat)*D2R, dLng=(b.lng-a.lng)*D2R;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dLng/2)**2;
  return 2*EARTH_MI*Math.asin(Math.min(1,Math.sqrt(s)));
}
function destination(from,angDist,bearing){
  const p1=from.lat*D2R, l1=from.lng*D2R;
  const p2=Math.asin(Math.sin(p1)*Math.cos(angDist)+Math.cos(p1)*Math.sin(angDist)*Math.cos(bearing));
  const l2=l1+Math.atan2(Math.sin(bearing)*Math.sin(angDist)*Math.cos(p1), Math.cos(angDist)-Math.sin(p1)*Math.sin(p2));
  return {lat:p2*R2D, lng:l2*R2D};
}

/* ================= GRID ================= */
function gridFor(bounds,targetW){
  const xspan=bounds.x1-bounds.x0, yspan=bounds.y1-bounds.y0;
  const gw=targetW, gh=Math.max(8,Math.round(targetW*yspan/xspan));
  const cw=xspan/gw, ch=yspan/gh;
  const mpcRow=new Float32Array(gh);   /* miles per cell side, per row */
  for(let j=0;j<gh;j++){
    const lat=unproj(0,bounds.y0+(j+0.5)*ch).lat;
    mpcRow[j]=cw*69.17*Math.cos(lat*D2R);
  }
  return {gw,gh,cw,ch,mpcRow};
}

/* ================= SPEED FIELD ================= */
function buildSpeedField(bounds,G,offroadMph){
  const {gw,gh,cw,ch}=G;
  const speed=new Float32Array(gw*gh).fill(offroadMph);
  for(const [cls,keys] of ROADS){
    const mph=SPEED[cls];
    for(let i=0;i<keys.length-1;i++){
      const A=PLACES[keys[i]], B=PLACES[keys[i+1]];
      if(!A||!B) continue;
      const pa=proj(A[0],A[1]), pb=proj(B[0],B[1]);
      const x0=(pa.x-bounds.x0)/cw, y0=(pa.y-bounds.y0)/ch;
      const x1=(pb.x-bounds.x0)/cw, y1=(pb.y-bounds.y0)/ch;
      const steps=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2));
      for(let s=0;s<=steps;s++){
        const t=s/steps;
        const cx=Math.round(x0+(x1-x0)*t), cy=Math.round(y0+(y1-y0)*t);
        if(cx<0||cy<0||cx>=gw||cy>=gh) continue;
        const k=cy*gw+cx;
        if(mph>speed[k]) speed[k]=mph;
      }
    }
  }
  /* one dilation pass so corridors are 3 cells wide */
  const out=new Float32Array(speed);
  for(let j=0;j<gh;j++) for(let i=0;i<gw;i++){
    const k=j*gw+i; let m=speed[k];
    if(i>0&&speed[k-1]>m)m=speed[k-1];
    if(i<gw-1&&speed[k+1]>m)m=speed[k+1];
    if(j>0&&speed[k-gw]>m)m=speed[k-gw];
    if(j<gh-1&&speed[k+gw]>m)m=speed[k+gw];
    out[k]=m;
  }
  return out;
}

/* ================= SEEDS ================= */
function seedCells(list,bounds,G){
  const {gw,gh,cw,ch}=G;
  const taken=new Set(), seeds=[];
  for(const p of list){
    const q=proj(p.lat,p.lng);
    let cx=Math.round((q.x-bounds.x0)/cw), cy=Math.round((q.y-bounds.y0)/ch);
    cx=Math.max(0,Math.min(gw-1,cx)); cy=Math.max(0,Math.min(gh-1,cy));
    if(taken.has(cy*gw+cx)){
      let done=false;
      for(let r=1;r<=5&&!done;r++)
        for(let dy=-r;dy<=r&&!done;dy++)
          for(let dx=-r;dx<=r&&!done;dx++){
            if(Math.abs(dx)!==r&&Math.abs(dy)!==r) continue;
            const nx=cx+dx, ny=cy+dy;
            if(nx<0||ny<0||nx>=gw||ny>=gh) continue;
            const k=ny*gw+nx;
            if(!taken.has(k)){ cx=nx; cy=ny; done=true; }
          }
    }
    taken.add(cy*gw+cx);
    seeds.push({cx,cy,id:p.id});
  }
  return seeds;
}

/* ============ MULTI-SOURCE SWEEP (chamfer, no heap) ============
   Converges to ~99.95% label agreement with exact Dijkstra in 6 passes.
   Buffers are reused across calls; N is the only thing that changes. */
let _swN=0, _swDist=null, _swLab=null;
function propagateSweepFast(speed,G,seeds,passes){
  const {gw,gh,mpcRow}=G, N=gw*gh, SQ2=Math.SQRT2;
  if(N!==_swN){ _swN=N; _swDist=new Float64Array(N); _swLab=new Int32Array(N); }
  const dist=_swDist, lab=_swLab;
  dist.fill(Infinity); lab.fill(-1);
  for(const s of seeds){ const k=s.cy*gw+s.cx; if(k>=0&&k<N){ dist[k]=0; lab[k]=s.id; } }
  for(let pass=0;pass<passes;pass++){
    for(let j=0;j<gh;j++){
      const mpc=mpcRow[j];
      for(let i=0;i<gw;i++){
        const k=j*gw+i;
        const sp=speed[k]>3?speed[k]:3;
        const base=mpc/sp*60, diag=SQ2*base;
        let nd;
        if(i>0 && (nd=dist[k-1]+base)<dist[k]){ dist[k]=nd; lab[k]=lab[k-1]; }
        if(j>0){
          if(i>0 && (nd=dist[k-gw-1]+diag)<dist[k]){ dist[k]=nd; lab[k]=lab[k-gw-1]; }
          if((nd=dist[k-gw]+base)<dist[k]){ dist[k]=nd; lab[k]=lab[k-gw]; }
          if(i<gw-1 && (nd=dist[k-gw+1]+diag)<dist[k]){ dist[k]=nd; lab[k]=lab[k-gw+1]; }
        }
      }
    }
    for(let j=gh-1;j>=0;j--){
      const mpc=mpcRow[j];
      for(let i=gw-1;i>=0;i--){
        const k=j*gw+i;
        const sp=speed[k]>3?speed[k]:3;
        const base=mpc/sp*60, diag=SQ2*base;
        let nd;
        if(i<gw-1 && (nd=dist[k+1]+base)<dist[k]){ dist[k]=nd; lab[k]=lab[k+1]; }
        if(j<gh-1){
          if(i<gw-1 && (nd=dist[k+gw+1]+diag)<dist[k]){ dist[k]=nd; lab[k]=lab[k+gw+1]; }
          if((nd=dist[k+gw]+base)<dist[k]){ dist[k]=nd; lab[k]=lab[k+gw]; }
          if(i>0 && (nd=dist[k+gw-1]+diag)<dist[k]){ dist[k]=nd; lab[k]=lab[k+gw-1]; }
        }
      }
    }
  }
  return {dist,lab};
}

/* ================= CROW-FLIES VORONOI ================= */
function clipHalfPlane(poly,ax,ay,bx,by){
  const nx=bx-ax, ny=by-ay, mx=(ax+bx)/2, my=(ay+by)/2;
  const out=[], n=poly.length;
  for(let i=0;i<n;i++){
    const P=poly[i], Q=poly[(i+1)%n];
    const sp=(P[0]-mx)*nx+(P[1]-my)*ny, sq=(Q[0]-mx)*nx+(Q[1]-my)*ny;
    if(sp<=0) out.push(P);
    if((sp<0&&sq>0)||(sp>0&&sq<0)){
      const t=sp/(sp-sq);
      out.push([P[0]+t*(Q[0]-P[0]), P[1]+t*(Q[1]-P[1])]);
    }
  }
  return out;
}
function polyArea(poly){ let a=0,n=poly.length;
  for(let i=0;i<n;i++){const p=poly[i],q=poly[(i+1)%n]; a+=p[0]*q[1]-q[0]*p[1];} return Math.abs(a)/2; }
function polyCentroid(poly){
  let a=0,cx=0,cy=0,n=poly.length;
  for(let i=0;i<n;i++){const p=poly[i],q=poly[(i+1)%n]; const f=p[0]*q[1]-q[0]*p[1]; a+=f; cx+=(p[0]+q[0])*f; cy+=(p[1]+q[1])*f;}
  a/=2;
  if(Math.abs(a)<1e-12){ let sx=0,sy=0; for(const p of poly){sx+=p[0];sy+=p[1];} return [sx/n,sy/n]; }
  return [cx/(6*a), cy/(6*a)];
}
function maxRadius(poly,x,y){ let m=0; for(const p of poly){const d=(p[0]-x)**2+(p[1]-y)**2; if(d>m)m=d;} return Math.sqrt(m); }
function polyPath(poly){ let d='M'; for(let i=0;i<poly.length;i++){ d+=(i?'L':'')+poly[i][0].toFixed(2)+' '+poly[i][1].toFixed(2);} return d+'Z'; }
function computeCells(list,b){
  const pts=list.map(p=>{const q=proj(p.lat,p.lng); return {p,x:q.x,y:q.y};});
  const n=pts.length;
  const rect=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];
  const cells=[];
  for(let i=0;i<n;i++){
    const a=pts[i], order=[];
    for(let j=0;j<n;j++){ if(j===i)continue; const q=pts[j]; const dx=a.x-q.x,dy=a.y-q.y; order.push([dx*dx+dy*dy,q]); }
    order.sort((u,v)=>u[0]-v[0]);
    let poly=rect, maxR=maxRadius(poly,a.x,a.y);
    for(let k=0;k<order.length;k++){
      if(Math.sqrt(order[k][0])>2*maxR) break;
      poly=clipHalfPlane(poly,a.x,a.y,order[k][1].x,order[k][1].y);
      if(poly.length<3){ poly=[]; break; }
      maxR=maxRadius(poly,a.x,a.y);
    }
    if(poly.length<3) continue;
    cells.push({site:a,poly,area:polyArea(poly),centroid:polyCentroid(poly)});
  }
  return cells;
}

/* ==================== POPULATION FIELD ==================== */
/* ---- source selection ----
   POP_SRC = null  -> use the kernel model below.
   POP_SRC = 'data:image/png;base64,...' -> use a real GHS-POP raster.
   See resamplePopRaster() for the expected encoding. */
const POP_SRC = null;
const POP_GRID = {lon0:-130, lon1:-108, lat0:36, lat1:52, gw:440, gh:320, unit:4};

const POP_CITIES = POP_CITIES_A.concat(POP_CITIES_B, POP_CITIES_C);
const POP_RING_MI = 500;
/* Best estimate of the true resident population inside the 500-mi ring:
   OR 4.24 + WA 7.71 + ID 1.84 + NV 3.10 + UT 3.27 + N.CA ~13 + W.MT ~0.7
   + BC ~3.5 + WY sliver ~0.05  =  ~37.5M. */
const POP_TARGET = 37.5e6;

/* Crude Pacific / BC coastline: westernmost land longitude by latitude.
   Only purpose is to stop the rural field from putting people in the ocean. */
const COAST = [
 [36.0,-121.9],[36.6,-121.9],[37.0,-122.5],[37.5,-122.5],[38.0,-123.0],
 [38.5,-123.2],[39.0,-123.7],[39.5,-123.8],[40.0,-124.4],[40.5,-124.4],
 [41.0,-124.1],[41.5,-124.1],[42.0,-124.4],[42.5,-124.4],[43.0,-124.4],
 [43.5,-124.4],[44.0,-124.1],[44.5,-124.1],[45.0,-123.96],[45.5,-123.96],
 [46.0,-124.1],[46.5,-124.1],[47.0,-124.2],[47.5,-124.4],[48.0,-124.7],
 [48.4,-124.6],[49.0,-123.3],[49.3,-123.2],[49.8,-123.4],[50.5,-124.0],
 [51.2,-124.6]
];
function coastLon(lat){
  if(lat<=COAST[0][0]) return COAST[0][1];
  for(let i=0;i<COAST.length-1;i++){
    const a=COAST[i], b=COAST[i+1];
    if(lat>=a[0] && lat<=b[0]){
      const t=(lat-a[0])/(b[0]-a[0]);
      return a[1]+t*(b[1]-a[1]);
    }
  }
  return COAST[COAST.length-1][1];
}
function isLand(lat,lng){
  if(lng > coastLon(lat)) return true;
  /* Vancouver Island: a box approximation, west of the mainland coast */
  if(lat>=48.3 && lat<=51.0 && lng>=-126.8 && lng<=-123.25) return true;
  return false;
}

/* sigma chosen so that peak density is roughly constant (~1.0k/km2), which
   is what real urban areas look like. Scaling sigma as sqrt(pop) keeps
   density invariant: P/(2*pi*s^2) is constant when s ~ sqrt(P). */
function kernelSigma(pop, override){
  if(override) return override;
  return Math.min(16, Math.max(0.85, 0.40*Math.sqrt(pop/1000)));
}

let _popKey='', _popField=null, _popMeta=null;

/* Returns {field, gw, gh, total, kernelSum, ruralSum, landCells}.
   field[k] = people living in that cell. */
function buildPopField(domain,G){
  const {gw,gh,cw,ch,mpcRow}=G;
  const key=[gw,gh,domain.x0.toFixed(4),domain.y0.toFixed(4),cw.toFixed(6),ch.toFixed(6)].join('|');
  if(key===_popKey && _popField) return _popMeta;

  const N=gw*gh;
  const dens=new Float64Array(N);        /* people per km2 */
  const areaRow=new Float64Array(gh);    /* km2 per cell, per row */
  for(let j=0;j<gh;j++){ const km=mpcRow[j]*1.609344; areaRow[j]=km*km; }

  /* --- kernels --- */
  for(let ci=0;ci<POP_CITIES.length;ci++){
    const lat=POP_CITIES[ci][0], lng=POP_CITIES[ci][1], p=POP_CITIES[ci][2];
    if(!p) continue;
    const q=proj(lat,lng);
    const s=kernelSigma(p, POP_CITIES[ci][3]);
    const cx=(q.x-domain.x0)/cw, cy=(q.y-domain.y0)/ch;
    const jc=Math.min(gh-1,Math.max(0,Math.round(cy)));
    const cellKm=mpcRow[jc]*1.609344;
    if(!(cellKm>0)) continue;
    const rCells=3*s/cellKm;
    const i0=Math.max(0,Math.floor(cx-rCells)), i1=Math.min(gw-1,Math.ceil(cx+rCells));
    const j0=Math.max(0,Math.floor(cy-rCells)), j1=Math.min(gh-1,Math.ceil(cy+rCells));
    if(i0>i1||j0>j1) continue;
    const peak=p/(2*Math.PI*s*s);       /* people/km2 at the centre */
    const inv2s2=1/(2*s*s);
    for(let j=j0;j<=j1;j++){
      const dy=(j+0.5-cy)*mpcRow[j]*1.609344;
      const row=j*gw;
      for(let i=i0;i<=i1;i++){
        const dx=(i+0.5-cx)*mpcRow[j]*1.609344;
        const d2=dx*dx+dy*dy;
        if(d2>9*s*s) continue;
        dens[row+i]+=peak*Math.exp(-d2*inv2s2);
      }
    }
  }

  /* --- land + ring masks, kernel total --- */
  const land=new Uint8Array(N);
  const pop=new Float64Array(N);
  let kernelSum=0, landCells=0;
  for(let j=0;j<gh;j++){
    const lat=unproj(0,domain.y0+(j+0.5)*ch).lat;
    const row=j*gw;
    for(let i=0;i<gw;i++){
      const lng=domain.x0+(i+0.5)*cw;
      if(!isLand(lat,lng)) continue;
      if(haversine(CENTER,{lat,lng})>POP_RING_MI) continue;
      land[row+i]=1; landCells++;
      kernelSum+=dens[row+i]*areaRow[j];
    }
  }

  /* --- rural residual, shaped by proximity to population centres ---
     R = gain * D^0.2.  Because D decays away from cities, so does R, which
     is much closer to reality than a uniform floor over the desert. */
  let shapeSum=0;
  const shape=new Float64Array(N);
  for(let j=0;j<gh;j++){
    const row=j*gw;
    for(let i=0;i<gw;i++){
      const k=row+i;
      if(!land[k]) continue;
      const v=Math.pow(dens[k]+1e-6, 0.2);
      shape[k]=v;
      shapeSum+=v*areaRow[j];
    }
  }
  let gain=0;
  if(shapeSum>0 && POP_TARGET>kernelSum) gain=(POP_TARGET-kernelSum)/shapeSum;
  gain=Math.min(gain, 60);

  let ruralSum=0, total=0;
  for(let j=0;j<gh;j++){
    const row=j*gw, a=areaRow[j];
    for(let i=0;i<gw;i++){
      const k=row+i;
      if(!land[k]){ pop[k]=0; continue; }
      const rural=gain*shape[k];
      ruralSum+=rural*a;
      pop[k]=(dens[k]+rural)*a;
      total+=pop[k];
    }
  }

  _popKey=key; _popField=pop;
  _popMeta={field:pop, gw, gh, cw, ch, mpcRow, areaRow, total, kernelSum, ruralSum, landCells, gain, cities:POP_CITIES.length};
  return _popMeta;
}

/* ---------------- optional real GHS-POP raster ---------------- */
/* POP_SRC is a PNG data URL over POP_GRID. Pixel (i,j) holds
   people-per-cell * POP_GRID.unit split as R=hi byte, G=lo byte.
   Row 0 is the NORTH edge. Decoded once, then box-averaged onto the
   basin grid inside buildPopField's caller via resamplePopRaster(). */
let _popRaster=null, _popRasterReady=false;
function loadPopRaster(cb){
  if(!POP_SRC){ cb(false); return; }
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');
    cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    const ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0);
    const d=ctx.getImageData(0,0,cv.width,cv.height).data;
    const n=cv.width*cv.height;
    const out=new Float32Array(n);
    for(let k=0,o=0;k<n;k++,o+=4) out[k]=((d[o]<<8)|d[o+1])*POP_GRID.unit;
    _popRaster={data:out, w:cv.width, h:cv.height};
    _popRasterReady=true;
    cb(true);
  };
  img.onerror=()=>{ _popRasterReady=false; cb(false); };
  img.src=POP_SRC;
}

/* box-average the decoded raster onto the current grid */
function resamplePopRaster(domain,G){
  if(!_popRasterReady||!_popRaster) return null;
  const {gw,gh,cw,ch}=G, R=_popRaster;
  const out=new Float64Array(gw*gh);
  const gx=(POP_GRID.gw)/(POP_GRID.lon1-POP_GRID.lon0);
  const gy=(POP_GRID.gh)/(POP_GRID.lat1-POP_GRID.lat0);
  for(let j=0;j<gh;j++){
    const lat=unproj(0,domain.y0+(j+0.5)*ch).lat;
    const sy=(POP_GRID.lat1-lat)*gy;
    const j0=Math.max(0,Math.floor(sy-0.5)), j1=Math.min(R.h-1,Math.ceil(sy+0.5));
    for(let i=0;i<gw;i++){
      const lng=domain.x0+(i+0.5)*cw;
      const sx=(lng-POP_GRID.lon0)*gx;
      const i0=Math.max(0,Math.floor(sx-0.5)), i1=Math.min(R.w-1,Math.ceil(sx+0.5));
      let s=0,c=0;
      for(let yy=j0;yy<=j1;yy++) for(let xx=i0;xx<=i1;xx++){ s+=R.data[yy*R.w+xx]; c++; }
      out[j*gw+i]=c?s/c:0;
    }
  }
  return out;
}

function fmtPop(n){
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'k';
  return Math.round(n).toString();
}

function visible(){ return parishes.filter(p=>!p.hidden&&!offJuris.has(p.jurisdiction)); }

const RING_PTS=(function(){
  const d=500/EARTH_MI, N=240, pts=[];
  for(let i=0;i<N;i++){ const t=destination(CENTER,d,i*2*Math.PI/N); pts.push(proj(t.lat,t.lng)); }
  return pts;
})();
const RING='M'+RING_PTS.map(q=>q.x.toFixed(3)+' '+q.y.toFixed(3)).join('L')+'Z';

document.getElementById('ringClipPath').setAttribute('d', RING);

/* Domain = parish extent UNION the 500-mi ring */
function computeDomain(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const acc=q=>{ if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y; };
  for(const p of parishes) acc(proj(p.lat,p.lng));
  for(const q of RING_PTS) acc(q);
  if(!isFinite(x0)) return {x0:-1,x1:1,y0:-1,y1:1};
  const pad=Math.max(x1-x0,y1-y0)*0.02+0.1;
  return {x0:x0-pad,x1:x1+pad,y0:y0-pad,y1:y1+pad};
}

function fitView(){
  const W=Math.max(1,svg.clientWidth||900), H=Math.max(1,svg.clientHeight||650);
  let w=domain.x1-domain.x0, h=domain.y1-domain.y0;
  const target=W/H;
  if(w/h<target) w=h*target; else h=w/target;
  const cx=(domain.x0+domain.x1)/2, cy=(domain.y0+domain.y1)/2;
  vb={x:cx-w/2, y:cy-h/2, w, h};
}

/* ============ REBUILD: basins + population histogram ============ */
function rebuildBasins(){
  const vis=visible();
  const G=gridFor(domain,GRID_W);
  const speed=buildSpeedField(domain,G,offroadMph);
  const seeds=seedCells(vis,domain,G);
  const {dist,lab}=propagateSweepFast(speed,G,seeds,PASSES);
  const {gw,gh,cw,ch,mpcRow}=G;

  /* population raster, co-registered to THIS grid (memoized on grid sig) */
  popMeta=buildPopField(domain,G);
  const popField=popMeta.field;

  /* ONE pass over the grid: cell count, centroid, population, and the
     population-weighted centroid all accumulate together. */
  const cnt=new Map(), sx=new Map(), sy=new Map(), ppl=new Map();
  const wxs=new Map(), wys=new Map(), wss=new Map();
  let tot=0;
  for(let j=0;j<gh;j++){
    const row=j*gw;
    for(let i=0;i<gw;i++){
      const k=row+i;
      const l=lab[k];
      if(l<0) continue;
      cnt.set(l,(cnt.get(l)||0)+1);
      sx.set(l,(sx.get(l)||0)+i);
      sy.set(l,(sy.get(l)||0)+j);
      const pv=popField[k];
      if(pv>0){
        ppl.set(l,(ppl.get(l)||0)+pv);
        wxs.set(l,(wxs.get(l)||0)+i*pv);
        wys.set(l,(wys.get(l)||0)+j*pv);
        wss.set(l,(wss.get(l)||0)+pv);
        tot+=pv;
      }
    }
  }
  basinCounts=cnt;
  basinPop=ppl;
  totalPop=tot;

  /* label anchors: population-weighted centroid, falling back to the seed */
  const seedOf=new Map(seeds.map(s=>[s.id,s]));
  basinAnchor=new Map();
  for(const [l,c] of cnt){
    let ax, ay;
    const ws=wss.get(l)||0;
    if(ws>0){ ax=wxs.get(l)/ws; ay=wys.get(l)/ws; }
    else { ax=sx.get(l)/c; ay=sy.get(l)/c; }
    const ci=Math.round(ax), cj=Math.round(ay);
    if(ci<0||cj<0||ci>=gw||cj>=gh||lab[cj*gw+ci]!==l){
      const s=seedOf.get(l);
      if(s){ ax=s.cx; ay=s.cy; }
    }
    basinAnchor.set(l,[domain.x0+(ax+0.5)*cw, domain.y0+(ay+0.5)*ch]);
  }

  /* jurisdiction rollups: area and population */
  const jc=new Map(), jp=new Map();
  let allCells=0, allPop=0;
  for(const [l,c] of cnt){
    const p=byId.get(l);
    if(!p) continue;
    allCells+=c;
    jc.set(p.jurisdiction,(jc.get(p.jurisdiction)||0)+c);
    const pv=ppl.get(l)||0;
    allPop+=pv;
    jp.set(p.jurisdiction,(jp.get(p.jurisdiction)||0)+pv);
  }
  basinJurFrac=new Map();
  for(const [j,c] of jc) basinJurFrac.set(j, allCells?c/allCells:0);
  basinJurPop=new Map();
  for(const [j,v] of jp) basinJurPop.set(j, allPop?v/allPop:0);

  const cv=basinCanvas(lab,gw,gh,id=>{ const p=byId.get(id); return p?colorOf(p.jurisdiction):'#94a3b8'; });
  basinHref=cv.toDataURL('image/png');
  basinG=G;
  basinDirty=false;
}

function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function basinCanvas(lab,gw,gh,colorOf){
  const cv=document.createElement('canvas');
  cv.width=gw; cv.height=gh;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(gw,gh), d=img.data;
  const cache=new Map();
  for(let i=0,j=0;i<gw*gh;i++,j+=4){
    const l=lab[i];
    if(l<0){ d[j+3]=0; continue; }
    let c=cache.get(l);
    if(!c){ c=hexRgb(colorOf(l)); cache.set(l,c); }
    d[j]=c[0]; d[j+1]=c[1]; d[j+2]=c[2]; d[j+3]=255;
  }
  ctx.putImageData(img,0,0);
  return cv;
}

/* ============ crow-flies comparison (population too) ============ */
function rebuildCrow(){
  crowCells=computeCells(visible(),domain);
  popMeta=popMeta||buildPopField(domain,gridFor(domain,GRID_W));
  const G=gridFor(domain,GRID_W);
  const popField=popMeta.field;
  const {gw,gh,cw,ch}=G;
  /* assign each population cell to its nearest site (crow-flies) */
  const sites=crowCells.map(c=>({id:c.site.p.id,x:c.site.x,y:c.site.y,j:c.site.p.jurisdiction}));
  const ppl=new Map(); let tot=0;
  for(let j=0;j<gh;j++){
    const y=domain.y0+(j+0.5)*ch;
    const row=j*gw;
    for(let i=0;i<gw;i++){
      const pv=popField[row+i];
      if(pv<=0) continue;
      const x=domain.x0+(i+0.5)*cw;
      let best=-1,bd=Infinity;
      for(let s=0;s<sites.length;s++){
        const dx=sites[s].x-x, dy=sites[s].y-y;
        const d=dx*dx+dy*dy;
        if(d<bd){ bd=d; best=sites[s].id; }
      }
      if(best>=0){ ppl.set(best,(ppl.get(best)||0)+pv); tot+=pv; }
    }
  }
  crowPop=ppl; crowTotalPop=tot;
  let allCells=0, allPop=0; const jc=new Map(), jp=new Map();
  for(const c of crowCells){ allCells+=c.area; const j=c.site.p.jurisdiction; jc.set(j,(jc.get(j)||0)+c.area); }
  for(const [id,v] of ppl){ const p=byId.get(id); if(!p) continue; allPop+=v; jp.set(p.jurisdiction,(jp.get(p.jurisdiction)||0)+v); }
  crowJurFrac=new Map(); for(const [j,a] of jc) crowJurFrac.set(j, allCells?a/allCells:0);
  crowJurPop=new Map();  for(const [j,v] of jp) crowJurPop.set(j, allPop?v/allPop:0);
  crowDirty=false;
}

let rafId=null, pendingRender=false;
function schedule(){
  if(pendingRender) return;
  pendingRender=true;
  rafId=requestAnimationFrame(()=>{ pendingRender=false; rafId=null; render(); });
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const W=Math.max(1,svg.clientWidth||900), H=Math.max(1,svg.clientHeight||650);
  const upp=Math.max(vb.w/W, vb.h/H);
  svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);

  renderTiles(W);
  scrim.setAttribute('x',vb.x); scrim.setAttribute('y',vb.y);
  scrim.setAttribute('width',vb.w); scrim.setAttribute('height',vb.h);
  scrim.setAttribute('opacity', PROVIDERS[provider].url?'0.30':'0');

  const vis=visible();
  const anchors=new Map(), weights=new Map(), pops=new Map();

  if(mode==='drive'){
    if(basinDirty) rebuildBasins();
    crowLayer.innerHTML='';
    basinImg.setAttribute('x',domain.x0);
    basinImg.setAttribute('y',domain.y0);
    basinImg.setAttribute('width',domain.x1-domain.x0);
    basinImg.setAttribute('height',domain.y1-domain.y0);
    basinImg.setAttribute('href',basinHref);
    basinImg.style.display='';
    const cellPx = basinG ? (basinG.cw/upp)*(basinG.ch/upp) : 0;
    for(const [id,a] of basinAnchor){
      anchors.set(id,a);
      weights.set(id,(basinCounts.get(id)||0)*cellPx);
      pops.set(id,basinPop.get(id)||0);
    }
  } else {
    if(crowDirty) rebuildCrow();
    basinImg.style.display='none';
    basinImg.removeAttribute('href');
    let h='';
    for(const c of crowCells){
      h+='<path class="crowCell" d="'+polyPath(c.poly)+'" fill="'+colorOf(c.site.p.jurisdiction)+'"/>';
    }
    crowLayer.innerHTML=h;
    for(const c of crowCells){
      anchors.set(c.site.p.id, c.centroid);
      weights.set(c.site.p.id, c.area/(upp*upp));
      pops.set(c.site.p.id, crowPop.get(c.site.p.id)||0);
    }
  }

  tip.classList.remove('on');
  const fs=11*upp, fs2=9.5*upp, pr=5.5*upp;
  const out=[];

  out.push('<path class="ring" d="'+RING+'"/>');
  const cp=proj(CENTER.lat,CENTER.lng);
  out.push('<g class="centerMark"><circle cx="'+cp.x+'" cy="'+cp.y+'" r="'+(7*upp)+
    '"/><path d="M'+(cp.x-15*upp)+' '+cp.y+'H'+(cp.x+15*upp)+'M'+cp.x+' '+(cp.y-15*upp)+'V'+(cp.y+15*upp)+'"/></g>');

  /* labels: name, and population underneath when the basin is big enough */
  out.push('<g class="labels" style="font-size:'+fs.toFixed(2)+'px;stroke-width:'+(3*upp).toFixed(3)+'">');
  for(const p of vis){
    const a=anchors.get(p.id), wt=weights.get(p.id)||0;
    if(!a) continue;
    if(wt<3000) continue;
    let nm=p.name;
    if(nm.length>32) nm=nm.slice(0,31).trim()+'\u2026';
    out.push('<text x="'+a[0].toFixed(2)+'" y="'+a[1].toFixed(2)+'">'+esc(nm)+'</text>');
    const pv=pops.get(p.id)||0;
    if(wt>9000 && pv>0){
      out.push('<text class="lp" x="'+a[0].toFixed(2)+'" y="'+(a[1]+fs*1.25).toFixed(2)+
        '" style="font-size:'+fs2.toFixed(2)+'px">'+fmtPop(pv)+'</text>');
    }
  }
  out.push('</g>');

  out.push('<g>');
  for(const p of vis){
    const q=proj(p.lat,p.lng);
    out.push('<circle class="pin'+(p.custom?' custom':'')+'" data-id="'+p.id+'" cx="'+q.x+'" cy="'+q.y+
      '" r="'+pr.toFixed(3)+'" fill="'+colorOf(p.jurisdiction)+'"/>');
  }
  out.push('</g>');

  overlay.innerHTML=out.join('');
  renderSidebar();
}

function renderSidebar(){
  const vis=visible();
  const counts={};
    for(const p of parishes) counts[p.jurisdiction]=(counts[p.jurisdiction]||0)+1;
  const shown=new Set(vis.map(p=>p.jurisdiction));

  const tot = mode==='drive'?totalPop:crowTotalPop;
  const src = popMeta && popMeta.cities ? (POP_SRC?'GHS-POP raster':'modeled from '+popMeta.cities+' population centres') : '';
  statsEl.innerHTML='<div class="big">'+fmtPop(tot)+'</div>'+
    '<div>people in <b>'+vis.length+'</b> of <b>'+parishes.length+'</b> parishes &middot; <b>'+shown.size+'</b> of '+Object.keys(counts).length+' jurisdictions</div>'+
    (src?'<div class="sub">'+esc(src)+(mode==='crow'?' &middot; crow-flies assignment':'')+'</div>':'');

  const frac = mode==='drive'?basinJurFrac:crowJurFrac;
  const pfrac = mode==='drive'?basinJurPop:crowJurPop;
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  let h='';
  for(const j of keys){
    const off=offJuris.has(j);
    const f=frac.get(j)||0, pf=pfrac.get(j)||0;
    h+='<button class="leg'+(off?' off':'')+'" data-jur="'+esc(j)+'" title="'+esc(fullName(j))+' — click to '+(off?'show':'hide')+'">'+
      '<span class="dot" style="background:'+colorOf(j)+'"></span>'+
      '<span class="jn">'+esc(j)+'</span>'+
      '<span class="cnt">'+counts[j]+'</span>'+
      '<span class="pct">'+(off?'\u2014':(f*100).toFixed(1)+'%')+'</span>'+
      '<span class="pop">'+(off?'\u2014':(pf*100).toFixed(1)+'%')+'</span></button>';
  }
  legendEl.innerHTML=h;

  const hid=parishes.filter(p=>p.hidden);
  if(!hid.length){
    hiddenEl.innerHTML='<p class="empty">Nothing hidden. Click any dot on the map to hide that parish.</p>';
  } else {
    hiddenEl.innerHTML=hid.map(p=>
      '<div class="hrow"><span class="dot" style="background:'+colorOf(p.jurisdiction)+'"></span>'+
      '<span class="hn" title="'+esc(p.name)+'">'+esc(p.name)+'</span>'+
      '<button class="mini" data-restore="'+p.id+'">restore</button>'+
      (p.custom?'<button class="mini danger" data-del="'+p.id+'">del</button>':'')+
      '</div>').join('');
  }
}

/* ============================== BASEMAP ============================== */
const PROVIDERS={
  usgs:{label:'SAT',max:16,attrib:'Imagery: USGS The National Map',
    url:(z,x,y)=>'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/'+z+'/'+y+'/'+x},
  esri:{label:'ESRI',max:19,attrib:'Imagery: Esri, Maxar, Earthstar Geographics',
    url:(z,x,y)=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x},
  none:{label:'OFF',max:0,attrib:'',url:null}
};
const PROVIDER_ORDER=['usgs','esri','none'];
let provider='usgs', tileFailed=false;
const tileEls=new Map();
const SVGNS='http://www.w3.org/2000/svg';

function updateAttrib(){
  const p=PROVIDERS[provider];
  attribEl.textContent=p.url?(p.attrib+(tileFailed?' \u2014 tiles blocked / offline':'')):'';
}
function clearTiles(){ tileEls.forEach(el=>el.remove()); tileEls.clear(); }

function renderTiles(W){
  const prov=PROVIDERS[provider];
  if(!prov||!prov.url){ clearTiles(); updateAttrib(); return; }
  let z=Math.round(Math.log2((360*W)/(256*vb.w)));
  z=Math.max(2,Math.min(prov.max,z));
  let S=360/Math.pow(2,z), tx0,tx1,ty0,ty1;
  const span=()=>{
    tx0=Math.floor((vb.x+180)/S); tx1=Math.floor((vb.x+vb.w+180)/S);
    ty0=Math.floor((vb.y+180)/S); ty1=Math.floor((vb.y+vb.h+180)/S);
  };
  span();
  while((tx1-tx0+1)*(ty1-ty0+1)>260 && z>2){ z--; S=360/Math.pow(2,z); span(); }
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    const key=provider+'/'+z+'/'+tx+'/'+ty;
    if(tileEls.has(key)) continue;
    const img=document.createElementNS(SVGNS,'image');
    img.setAttribute('x',(tx*S-180).toFixed(4));
    img.setAttribute('y',(ty*S-180).toFixed(4));
    img.setAttribute('width',S.toFixed(4));
    img.setAttribute('height',S.toFixed(4));
    img.setAttribute('preserveAspectRatio','none');
    img.setAttribute('pointer-events','none');
    const src=prov.url(z,tx,ty);
    img.setAttribute('href',src);
    try{ img.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',src); }catch(e){}
    img.addEventListener('error',()=>{ if(!tileFailed){ tileFailed=true; updateAttrib(); } });
    tileLayer.appendChild(img);
    tileEls.set(key,img);
  }
  tileEls.forEach((el,key)=>{
    const p=key.split('/'); const zz=+p[1], tx=+p[2], ty=+p[3];
    if(zz!==z||tx<tx0-1||tx>tx1+1||ty<ty0-1||ty>ty1+1){ el.remove(); tileEls.delete(key); }
  });
  updateAttrib();
}

/* ============================== VIEW ============================== */
function toUser(clientX,clientY){
  const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  const m=svg.getScreenCTM();
  if(!m) return {x:0,y:0};
  const q=pt.matrixTransform(m.inverse());
  return {x:q.x,y:q.y};
}
function clampW(w){
  const base=domain.x1-domain.x0;
  return Math.min(base*2, Math.max(base/80, w));
}
function zoomAt(q,f){
  const nw=clampW(vb.w*f), k=nw/vb.w;
  vb.x=q.x-(q.x-vb.x)*k; vb.y=q.y-(q.y-vb.y)*k;
  vb.w=nw; vb.h*=k;
  schedule();
}

/* ============================== EVENTS ============================== */
let drag=null, suppress=false;

svg.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  suppress=false;
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
});
svg.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4) drag.moved=true;
  if(drag.moved){
    const a=toUser(drag.x,drag.y), b=toUser(e.clientX,e.clientY);
    vb.x-=(b.x-a.x); vb.y-=(b.y-a.y);
    schedule();
  }
  drag.x=e.clientX; drag.y=e.clientY;
});
svg.addEventListener('pointerup',()=>{ if(drag&&drag.moved) suppress=true; drag=null; });
svg.addEventListener('pointercancel',()=>{ drag=null; });
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(toUser(e.clientX,e.clientY), Math.exp(e.deltaY*0.0015));
},{passive:false});

svg.addEventListener('click',e=>{
  if(suppress){ suppress=false; return; }
  const pin=e.target.closest?e.target.closest('.pin'):null;
  if(pin){
    const p=byId.get(+pin.dataset.id);
    if(p){ p.hidden=true; basinDirty=true; crowDirty=true; render(); }
    return;
  }
  openCreate(toUser(e.clientX,e.clientY));
});

svg.addEventListener('mousemove',e=>{
  const pin=e.target.closest?e.target.closest('.pin'):null;
  if(!pin){ tip.classList.remove('on'); return; }
  const p=byId.get(+pin.dataset.id);
  if(!p) return;
  const map = mode==='drive'?basinPop:crowPop;
  const tot = mode==='drive'?totalPop:crowTotalPop;
  const pv=map.get(p.id)||0;
  let extra='';
  if(pv>0 && tot>0){
    extra='<div class="tp"><b>'+fmtPop(pv)+'</b> people &middot; '+((pv/tot)*100).toFixed(1)+'% of basin total</div>';
  }
  tip.innerHTML='<b>'+esc(p.name)+'</b>'+
    '<div class="tj">'+esc(fullName(p.jurisdiction))+'</div>'+
    '<div class="tm">'+esc(p.city)+(p.state?', '+esc(p.state):'')+' &middot; '+p.miles+' mi from Burns</div>'+extra;
  tip.classList.add('on');
  const w=tip.offsetWidth||240, hg=tip.offsetHeight||70;
  let x=e.clientX+16, y=e.clientY+16;
  if(x+w>innerWidth-8) x=e.clientX-w-16;
  if(y+hg>innerHeight-8) y=e.clientY-hg-16;
  tip.style.left=Math.max(8,x)+'px';
  tip.style.top=Math.max(8,y)+'px';
});
svg.addEventListener('mouseleave',()=>tip.classList.remove('on'));

legendEl.addEventListener('click',e=>{
  const b=e.target.closest('.leg');
  if(!b) return;
  const j=b.dataset.jur;
  if(offJuris.has(j)) offJuris.delete(j); else offJuris.add(j);
  basinDirty=true; crowDirty=true; render();
});

hiddenEl.addEventListener('click',e=>{
  const r=e.target.closest('[data-restore]');
  if(r){
    const p=byId.get(+r.dataset.restore);
    if(p){ p.hidden=false; basinDirty=true; crowDirty=true; render(); }
    return;
  }
  const d=e.target.closest('[data-del]');
  if(d){
    const id=+d.dataset.del;
    const i=parishes.findIndex(p=>p.id===id);
    if(i>=0){ parishes.splice(i,1); byId.delete(id); }
    domain=computeDomain(); basinDirty=true; crowDirty=true; render();
  }
});

document.getElementById('restoreAll').addEventListener('click',()=>{
  for(const p of parishes) p.hidden=false;
  offJuris.clear();
  basinDirty=true; crowDirty=true; render();
});

document.getElementById('mode').addEventListener('click',()=>{
  mode = mode==='drive'?'crow':'drive';
  const b=document.getElementById('mode');
  b.textContent = mode==='drive'?'DRIVE':'CROW';
  b.classList.toggle('act', mode==='drive');
  render();
});

document.getElementById('prov').addEventListener('click',()=>{
  const i=PROVIDER_ORDER.indexOf(provider);
  provider=PROVIDER_ORDER[(i+1)%PROVIDER_ORDER.length];
  document.getElementById('prov').textContent=PROVIDERS[provider].label;
  tileFailed=false; clearTiles(); render();
});

document.getElementById('zin').addEventListener('click',()=>{ zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},0.72); });
document.getElementById('zout').addEventListener('click',()=>{ zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},1/0.72); });
document.getElementById('zfit').addEventListener('click',()=>{ fitView(); schedule(); });

const offRoadEl=document.getElementById('offRoad'), offValEl=document.getElementById('offVal');
let sliderTimer=null;
offRoadEl.addEventListener('input',()=>{
  offroadMph=+offRoadEl.value;
  offValEl.textContent=offroadMph+' mph';
  basinDirty=true;
  clearTimeout(sliderTimer);
  sliderTimer=setTimeout(()=>{ render(); }, 90);
});

/* ============================== CREATE FLOW ============================== */
let pending=null;
const mName=document.getElementById('mName');
const mJur=document.getElementById('mJur');
const mCoords=document.getElementById('mCoords');

mJur.innerHTML=Object.keys(JUR).map(j=>'<option value="'+esc(j)+'">'+esc(j)+' \u2014 '+esc(JUR[j].full)+'</option>').join('');

function openCreate(q){
  pending=q;
  const ll=unproj(q.x,q.y);
  mCoords.textContent=ll.lat.toFixed(4)+'\u00b0, '+ll.lng.toFixed(4)+'\u00b0  \u00b7  '+haversine(CENTER,ll).toFixed(1)+' mi from Burns';
  mName.value=''; mJur.value='GOA';
  modal.classList.add('open');
  setTimeout(()=>mName.focus(),30);
}
function closeCreate(){ modal.classList.remove('open'); pending=null; }

function addParish(){
  if(!pending) return;
  const ll=unproj(pending.x,pending.y);
  const name=(mName.value||'').trim()||'Untitled parish';
  const p={id:nextId++,name,jurisdiction:mJur.value,city:'\u2014',state:'',
    lat:ll.lat,lng:ll.lng,miles:Math.round(haversine(CENTER,ll)*10)/10,hidden:false,custom:true};
  parishes.push(p); byId.set(p.id,p);
  const nd=computeDomain();
  const grew=nd.x0<domain.x0||nd.x1>domain.x1||nd.y0<domain.y0||nd.y1>domain.y1;
  domain=nd;
  if(grew) fitView();
  basinDirty=true; crowDirty=true;
  closeCreate(); render();
}

document.getElementById('mAdd').addEventListener('click',addParish);
document.getElementById('mCancel').addEventListener('click',closeCreate);
modal.addEventListener('click',e=>{ if(e.target===modal) closeCreate(); });
mName.addEventListener('keydown',e=>{ if(e.key==='Enter') addParish(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCreate(); });

/* ============================== BOOT ============================== */
domain=computeDomain();
fitView();

/* If a real GHS-POP raster is supplied it decodes asynchronously, so we
   render immediately and re-render once the raster is ready. */
if(POP_SRC){
  loadPopRaster(ok=>{ basinDirty=true; crowDirty=true; render(); });
}
render();

let rsz=null;
window.addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{
    const W=Math.max(1,svg.clientWidth||900), H=Math.max(1,svg.clientHeight||650);
    const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
    const h=vb.h, w=h*(W/H);
    vb={x:cx-w/2,y:cy-h/2,w,h};
    render();
  },120);
});
</script>
